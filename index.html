let monthOffset=0;function homeMarkup(){const now=new Date(),m=new Date(now.getFullYear(),now.getMonth()+monthOffset,1),count=new Date(m.getFullYear(),m.getMonth()+1,0).getDate(),offset=(m.getDay()+6)%7;const days=['M','T','W','T','F','S','S'];return '<header class="one-header"><div>'+head('FORM')+'<p class="tag">Train with focus, follow your progress.</p></div><time><strong>'+now.toLocaleDateString(undefined,{weekday:'long'})+'</strong><span>'+now.toLocaleDateString(undefined,{month:'short',day:'numeric'})+'</span></time></header><div class="one-dashboard"><button class="one-workout" data-go="Workouts"><span class="one-copy"><strong>Ready to train?</strong><span>Choose your workout</span></span><span class="one-start">Start</span></button><article class="card one-streak"><div class="row"><div><h2 class="one-streak-title">'+icon('trophy')+' Training streak</h2><p>Set your weekly schedule</p></div><button class="one-calendar" aria-label="Manage Rest Days" id="rest-days">'+icon('calendar-days')+'</button></div><div class="days">'+days.map(x=>'<div class="day">'+x+'<b>–</b></div>').join('')+'</div><div class="one-month"><div class="row"><strong>'+m.toLocaleDateString(undefined,{month:'long',year:'numeric'})+'</strong><span><button data-month="-1" aria-label="Previous Month">'+icon('chevron-left')+'</button><button data-month="1" aria-label="Next Month">'+icon('chevron-right')+'</button></span></div><div class="month-grid">'+days.map(x=>'<span class="muted">'+x+'</span>').join('')+Array.from({length:offset},()=>'<span></span>').join('')+Array.from({length:count},(_,i)=>'<span class="month-day">'+(i+1)+'</span>').join('')+'</div></div><div class="row one-best"><span class="muted">Personal best</span><strong>0 weeks</strong></div><p id="rest-note" hidden>Rest-day scheduling will be available when the workout engine is connected.</p></article></div>'}function render(){let html='';if(page==='Home')html=homeMarkup();else if(page==='Workouts')html=head('Workouts')+'<div class function go(t){page=t;render()}document.querySelector('.nav').innerHTML=tabs.map((t,i)=>'<button aria-label="'+t+'" data-go="'+t+'">'+icon(icons[i])+'</button>').join('');document.querySelector('.proxy').innerHTML=tabs.map(t=>'<button tabindex="-1" data-go="'+t+'">'+t+'</button>').join('');document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.month){monthOffset+=Number(b.dataset.month);render();return}if(b.id==='rest-days'){document.getElementById('rest-note').hidden=!document.getElementById('rest-note').hidden;return}if(b.id==='check-update'){update(true);return}if(b.dataset.go)go(b.dataset.go);if(b.dataset.section&&page==='Workouts'&&section!==b.dataset.section){section=b.dataset.section;document.querySelectorAll('.seg button').forEach(n=>n.setAttribute('aria-pressed',String(n.dataset.section===section)));const search=main.querySelector('.search');search.value='';search.setAttribute('aria-label','Search '+section);search.placeholder='Search '+section.toLowerCase();const cards=main.querySelector('.cards');cards.querySelector('h2').textContent=section==='Routines'?'Your routines':'Workout history';cards.querySelector('p').textContent=section==='Routines'?'No routines yet. Your saved routines will appear here.':'Completed workouts will appear here.';if(!matchMedia('(prefers-reduced-motion: reduce)').matches){cards.getAnimations().forEach(a=>a.cancel());cards.animate([{opacity:.55},{opacity:1}],{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'})}}});addEventListener('resize',layout);navigator.devicePosture?.addEventListener('change',layout);matchMedia('(device-posture: folded)').addEventListener('change',layout);let checking=false;async function update(manual=false){if(checking||(!manual&&document.hidden))return;checking=true;const button=document.getElementById('check-update');if(manual&&button)button.textContent='Checking…';try{const url=new URL('index.html',location.href);url.searchParams.set('check',Date.now());const resp
