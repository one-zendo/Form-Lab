<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#17171F"><meta name="apple-mobile-web-app-capable" content="yes"><title>FORM</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/inter@5.1.1/index.css"><script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script><style>
/* Global design tokens and base styles */

:root{color-scheme:dark;--canvas:#17171f;--paper:#24242e;--raised:#30303c;--ink:#f5f5f5;--muted:#a3a3a3;--action:#b0ff00;--on-action:#17171f;--radius-card:20px;--radius-control:12px;--radius-full:999px;--motion-duration:320ms;--motion-ease:cubic-bezier(.2,.8,.2,1);--motion:var(--motion-duration) var(--motion-ease);--motion-control:200ms}*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;background:var(--canvas);color:var(--ink);font:400 15px Inter,-apple-system,sans-serif;overflow:hidden}button,input{font:inherit;color:inherit}button{border:0;cursor:pointer;min-height:44px;background:var(--raised);border-radius:var(--radius-control)}button:focus-visible,input:focus-visible{outline:2px solid var(--action);outline-offset:2px}button:active{transform:scale(.98)}svg{width:20px;height:20px;stroke-width:1.75}main{position:fixed;inset:0;overflow:auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(88px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));scrollbar-width:none}main::-webkit-scrollbar{display:none}
.page{max-width:960px;margin:auto}
.headline{display:flex;align-items:center;gap:10px;height:44px;font-size:28px;font-weight:700;letter-spacing:-.7px;margin:0}
.headline:before{content:'';width:3px;height:24px;background:var(--action);border-radius:999px}
.tag{margin:0 0 24px 13px;color:var(--muted);font-size:13px}

.card{background:var(--paper);border-radius:var(--radius-card);padding:var(--card-padding);min-width:0}
.card h2{font-size:17px;margin:0 0 8px;font-weight:600}

.hero{min-height:132px}

.section{font-size:22px;font-weight:600;margin:24px 0 12px}
.seg{display:flex;background:var(--paper);padding:4px;border-radius:12px;gap:4px;margin:12px 0}
.seg button{flex:1;background:transparent}
.seg button[aria-pressed=true]{background:var(--raised);color:var(--action)}
.search{width:100%;height:48px;background:var(--paper);border:0;border-radius:12px;padding:0 16px;margin-bottom:12px}
.stat{font-size:32px;font-weight:700;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.nav{position:fixed;z-index:5;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border:1px solid #ffffff25;border-radius:var(--radius-full);background:#30303ce8;backdrop-filter:blur(20px);max-width:calc(100% - 16px)}
.nav button{width:48px;height:48px;min-width:44px;display:grid;place-items:center;background:transparent;border-radius:50%;color:var(--muted);transition:background var(--motion-control),color var(--motion-control)}
.nav button[aria-current=page]{background:var(--action);color:var(--on-action)}
body[data-dock=side] main{padding-right:calc(82px + env(safe-area-inset-right));padding-bottom:calc(16px + env(safe-area-inset-bottom))}
body[data-dock=side] .nav{left:auto;right:calc(8px + env(safe-area-inset-right));top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column}
body[data-layout=folded-portrait] .nav{position:absolute;left:429px;right:auto;transform:translate3d(-50%,-50%,0)}
body[data-layout=folded-portrait]{overflow:visible}
html:has(body[data-layout=folded-portrait]){overflow:visible}
.proxy{display:none}
body[data-layout=folded-portrait] .proxy{display:flex;position:fixed;right:0;top:50%;transform:translateY(-50%);flex-direction:column;gap:4px;z-index:6;opacity:0} .proxy button{width:48px;height:48px}
.foot{font-size:12px;color:var(--muted);margin-top:24px}
.enter{animation:enter var(--motion)}@keyframes enter{from{opacity:.3;transform:translateY(12px)}to{opacity:1;transform:none}}

@media(horizontal-viewport-segments:2){body[data-posture=folded] main{width:env(viewport-segment-width 0 0,50vw);padding-right:16px}
body[data-posture=folded] .nav{left:auto;right:calc(100vw - env(viewport-segment-right 1 0,100vw) + 8px);top:calc(env(viewport-segment-top 1 0,0px) + env(viewport-segment-height 1 0,100dvh)/2);bottom:auto;transform:translateY(-50%);flex-direction:column}}
@media(vertical-viewport-segments:2){body[data-posture=folded] main{height:env(viewport-segment-height 0 0,50dvh);padding-right:16px;padding-bottom:16px}
body[data-posture=folded] .nav{left:50%;right:auto;top:auto;bottom:calc(100dvh - env(viewport-segment-bottom 0 1,100dvh) + 8px);transform:translateX(-50%);flex-direction:row}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(prefers-reduced-transparency:reduce){.nav{backdrop-filter:none;background:var(--raised)}}
html,body{touch-action:pan-x pan-y}button{touch-action:manipulation}
html,body{overscroll-behavior:none}main{overflow-x:hidden;overflow-y:auto;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.nav,.proxy{touch-action:none;overscroll-behavior:none}
/* Shared adaptive card system */
:root{--card-padding:16px;--card-gap:16px;--card-min-width:240px;--card-feature-height:156px;--card-inner-gap:8px;--card-action-height:48px}
body[data-layout=folded-portrait]{--card-padding:12px;--card-gap:12px}
body[data-layout=folded-landscape]{--card-padding:12px;--card-gap:12px;--card-min-width:180px}
body[data-layout=unfolded-portrait]{--card-feature-height:220px}
.adaptive-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,var(--card-min-width)),1fr));gap:var(--card-gap);align-items:stretch}
.adaptive-grid[data-stack]{grid-template-columns:minmax(0,1fr)}
.adaptive-card{min-width:0;width:100%;padding:var(--card-padding);border-radius:var(--radius-card)}
.adaptive-card[data-feature]{min-height:var(--card-feature-height)}
body[data-layout$="-portrait"] .adaptive-grid[data-dashboard]{grid-template-columns:minmax(0,1fr)}
body[data-layout$="-landscape"] .adaptive-grid[data-dashboard]{grid-template-columns:repeat(2,minmax(0,1fr))}

@media(horizontal-viewport-segments:2){body[data-posture=folded] .adaptive-grid[data-dashboard]{grid-template-columns:minmax(0,1fr)}}
.diagnostic-caption{color:var(--muted);margin:0 0 var(--card-gap)}.diagnostic-row{display:flex;justify-content:space-between;gap:var(--card-inner-gap);padding:var(--card-inner-gap) 0;border-bottom:1px solid #ffffff15;font-size:12px;overflow-wrap:anywhere}.diagnostic-row span{color:var(--muted)}.diagnostic-row strong{text-align:right;font-variant-numeric:tabular-nums}.diagnostic-scroll{margin-top:var(--card-gap)}.diagnostic-marker{padding:var(--card-padding);margin-top:var(--card-inner-gap);background:var(--raised);border-radius:var(--radius-control)}#check-update{padding:0 var(--card-padding)}
.developer-settings{color:var(--ink);background:var(--paper);border:1px solid var(--raised);border-radius:var(--radius-card);padding:var(--card-padding);width:min(320px,90%);max-height:85%;overflow:auto}.developer-settings::backdrop{background:#0008}.developer-settings button{width:100%;margin-top:var(--card-inner-gap)}.developer-settings input{accent-color:var(--action);width:24px;height:24px}.nav button,.proxy button{-webkit-touch-callout:none;user-select:none}
</style></head><body><main id="main"></main><nav class="nav" aria-label="Main navigation"></nav><div class="proxy" aria-hidden="true"></div><script>
const BUILD=54;
// Global motion tokens

for(const event of ["gesturestart","gesturechange","gestureend"])document.addEventListener(event,e=>e.preventDefault(),{passive:false});const tabs=['Home','Workouts','Progress','Profile'],icons=['house','dumbbell','chart-no-axes-combined','user-round'];let page='Home';const main=document.querySelector('main');const icon=n=>'<i data-lucide="'+n+'"></i>';const head=t=>'<h1 class="headline">'+t+'</h1>';
// Adaptive layout and docking
let dockRects=null,dockMode='',dockAnimations=[];function layout(){const nav=document.querySelector('.nav');const w=document.documentElement.clientWidth,h=document.documentElement.clientHeight,s=Math.min(w,h),l=Math.max(w,h),ratio=Math.min(screen.width,screen.height)/Math.max(screen.width,screen.height);const duo=ratio>.62;const folded=duo&&s<=530&&l<=760;const mode=folded?'folded-'+(w>h?'landscape':'portrait'):duo?'unfolded-'+(w>h?'landscape':'portrait'):'standard-'+(w>h?'landscape':'portrait');document.body.dataset.layout=mode;document.body.dataset.dock=folded||w>h?'side':'bottom';document.body.dataset.posture=navigator.devicePosture?.type||(matchMedia('(device-posture: folded)').matches?'folded':'unknown');const nextMode=mode+':'+document.body.dataset.posture;const nodes=[nav,...nav.querySelectorAll('button')];if(nextMode!==dockMode){dockAnimations.forEach(a=>a.cancel());dockAnimations=[];const next=nodes.map(n=>n.getBoundingClientRect());if(dockRects&& !matchMedia('(prefers-reduced-motion: reduce)').matches){nodes.forEach((n,i)=>{const a=dockRects[i],b=next[i];if(!a||!b.width||!b.height)return;const dx=a.left+a.width/2-b.left-b.width/2,dy=a.top+a.height/2-b.top-b.height/2;const parent=i?{x:dockRects[0].left+dockRects[0].width/2-next[0].left-next[0].width/2,y:dockRects[0].top+dockRects[0].height/2-next[0].top-next[0].height/2}:{x:0,y:0};const frames=i?[{translate:(dx-parent.x)+'px '+(dy-parent.y)+'px'},{translate:'0px 0px'}]:[{translate:dx+'px '+dy+'px',clipPath:'inset(0 round 999px)'},{translate:'0px 0px',clipPath:'inset(0 round 999px)'}];dockAnimations.push(n.animate(frames,motionOptions()))})}dockRects=next;dockMode=nextMode}else if(!dockAnimations.some(a=>a.playState==='running'))dockRects=nodes.map(n=>n.getBoundingClientRect());const f=document.querySelector('.foot');if(f)f.textContent='Build '+BUILD+' · '+mode+' · '+document.body.dataset.posture;diagnostics()}

// Diagnostic pages only; shared navigation and viewport engine remain intact.
let taps=0,showDiagnostics=false;try{showDiagnostics=localStorage.getItem('form.diagnostics')==='true'}catch{}
function diagnostics(){const root=document.documentElement,v=window.visualViewport,n=document.querySelector('.nav').getBoundingClientRect(),m=main.getBoundingClientRect(),s=getComputedStyle(main);const values=[['Layout',document.body.dataset.layout],['Posture',document.body.dataset.posture],['Dock',document.body.dataset.dock],['Layout viewport',root.clientWidth+' × '+root.clientHeight],['Visual viewport',v?Math.round(v.width)+' × '+Math.round(v.height):'Unavailable'],['Visual scale',v?v.scale.toFixed(3):'Unavailable'],['Screen',screen.width+' × '+screen.height],['Content bounds',Math.round(m.width)+' × '+Math.round(m.height)],['Content padding',s.padding],['Navigation bounds',[n.x,n.y,n.width,n.height].map(Math.round).join(' / ')],['Navigation taps',taps],['Content scroll',Math.round(main.scrollTop)+' px']];const d=document.getElementById('diagnostics');if(d){d.replaceChildren(...values.map(([k,v])=>{const row=document.createElement('div');row.className='diagnostic-row';const a=document.createElement('span'),b=document.createElement('strong');a.textContent=k;b.textContent=v;row.append(a,b);return row}))}}
function render(){main.innerHTML=showDiagnostics?'<div class="page enter">'+head(page)+'<p class="diagnostic-caption">Navigation and viewport test · '+page+'</p><article class="card adaptive-card"><h2>Live diagnostics</h2><div id="diagnostics"></div></article><p class="foot"></p><button id="check-update">Check for Updates</button><article class="card adaptive-card diagnostic-scroll"><h2>Scroll test</h2><p>Swipe vertically. The navigation should stay stationary.</p>'+Array.from({length:12},(_,i)=>'<div class="diagnostic-marker">Scroll marker '+(i+1)+'</div>').join('')+'</article></div>':'';main.scrollTop=0;document.querySelectorAll('.nav button').forEach((b,i)=>b.setAttribute('aria-current',tabs[i]===page?'page':'false'));window.lucide?.createIcons({attrs:{'stroke-width':1.75}});layout();diagnostics()}
main.addEventListener('scroll',diagnostics,{passive:true});addEventListener('resize',diagnostics);window.visualViewport?.addEventListener('resize',diagnostics);navigator.devicePosture?.addEventListener('change',diagnostics);matchMedia('(device-posture: folded)').addEventListener('change',diagnostics);
// Developer settings: long press works on both visible navigation and folded hit proxies.
const dev=document.createElement('dialog');dev.className='developer-settings';dev.innerHTML='<h2>Developer settings</h2><label class="row">Show diagnostics <input type="checkbox" id="show-diagnostics"></label><p>Build '+BUILD+'</p><button id="dev-update">Check for Updates</button><button id="dev-close">Done</button>';document.body.append(dev);
function openDeveloper(){dev.querySelector('input').checked=showDiagnostics;dev.showModal()}
dev.querySelector('input').addEventListener('change',e=>{showDiagnostics=e.target.checked;try{localStorage.setItem('form.diagnostics',String(showDiagnostics))}catch{}render()});
dev.querySelector('#dev-close').onclick=()=>dev.close();dev.querySelector('#dev-update').onclick=()=>update(true);
let holdTimer=null,held=false,origin=null;function cancelHold(){clearTimeout(holdTimer);holdTimer=null}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('button[data-go="Profile"]'))return;held=false;origin=[e.clientX,e.clientY];cancelHold();holdTimer=setTimeout(()=>{held=true;openDeveloper()},3000)});
document.addEventListener('pointermove',e=>{if(origin&&Math.hypot(e.clientX-origin[0],e.clientY-origin[1])>12)cancelHold()});
for(const event of ['pointerup','pointercancel','lostpointercapture'])document.addEventListener(event,()=>{cancelHold();origin=null});
document.addEventListener('contextmenu',e=>{if(e.target.closest('button[data-go="Profile"]'))e.preventDefault()});
document.addEventListener('click',e=>{if(held&&e.target.closest('button[data-go="Profile"]')){held=false;e.preventDefault();e.stopImmediatePropagation()}},true);
function go(t){taps++;page=t;render()}document.querySelector('.nav').innerHTML=tabs.map((t,i)=>'<button aria-label="'+t+'" data-go="'+t+'">'+icon(icons[i])+'</button>').join('');document.querySelector('.proxy').innerHTML=tabs.map(t=>'<button tabindex="-1" data-go="'+t+'">'+t+'</button>').join('');document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='check-update'){update(true);return}if(b.dataset.go)go(b.dataset.go)});addEventListener('resize',layout);navigator.devicePosture?.addEventListener('change',layout);matchMedia('(device-posture: folded)').addEventListener('change',layout);
// Deployment update checks
let checking=false;async function update(manual=false){if(checking||(!manual&&document.hidden))return;checking=true;const button=dev.open?document.getElementById('dev-update'):document.getElementById('check-update');if(manual&&button)button.textContent='Checking…';try{const url=new URL('index.html',location.href);url.searchParams.set('check',Date.now());const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const source=await response.text();const latest=Number(source.match(/const BUILD=(\d+)/)?.[1]);if(!latest)throw Error('Build not found');if(latest>BUILD){if(button)button.textContent='Updating to Build '+latest;const target=new URL(location.pathname,location.origin);target.searchParams.set('refresh',Date.now());location.replace(target.href)}else if(manual&&button)button.textContent='Build '+BUILD+' · Up to Date'}catch{if(manual&&button)button.textContent='Check Failed · Try Again'}finally{checking=false}}addEventListener('pageshow',()=>update());addEventListener('focus',()=>update());document.addEventListener('visibilitychange',()=>update());addEventListener('online',()=>update());setInterval(()=>update(),15000);render();update();
</script></body></html>
