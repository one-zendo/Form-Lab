<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17171F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>FORM Display Lab</title><style>
:root{color-scheme:dark;--canvas:#17171f;--paper:#24242e;--ink:#f5f5f5;--lime:#b0ff00;--blue:#0088ff}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;background:var(--canvas);color:var(--ink);font:14px Inter,-apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}#canvas{position:fixed;left:0;top:0;height:100dvh;border:2px solid var(--lime);pointer-events:none}#ruler{position:absolute;top:0;left:0;width:100%;height:32px;background:repeating-linear-gradient(90deg,#0088ff88 0 1px,transparent 1px 10px);font:10px monospace}#ruler span{position:absolute;top:12px}main{position:relative;width:min(100%,320px);max-height:calc(100dvh - 48px);overflow:auto;margin-top:40px;padding:12px;background:var(--paper);border-radius:16px;z-index:2}h1{font-size:20px;margin:0 0 8px}pre{white-space:pre-wrap;font:12px monospace;line-height:1.5}button{background:#30303c;color:var(--ink);border:0;border-radius:10px;padding:10px;min-height:44px;font:inherit}input{width:100%;accent-color:var(--lime)}#rail{position:fixed;top:50%;width:58px;transform:translate(-50%,-50%);display:grid;gap:6px;padding:5px;border:1px solid #ffffff35;border-radius:40px;background:#30303c;z-index:3}#rail button{width:46px;height:46px;border-radius:50%;padding:0}#rail button:first-child{background:var(--lime);color:var(--canvas)}#rail button.hit{background:var(--blue);color:white}#touch{position:absolute;width:16px;height:16px;border:2px solid var(--blue);border-radius:50%;pointer-events:none;display:none;z-index:5}#probe{position:absolute;visibility:hidden;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#canvas,#rail{will-change:transform}body.layer #canvas{position:absolute;transform:translateZ(0)}body.layer #rail{position:absolute;transform:translate3d(-50%,-50%,0)}body.layer,html:has(body.layer){overflow:visible} body.layer.contained,html:has(body.layer.contained){overflow:hidden}body.layer.contained #canvas{width:var(--test-width);contain:layout style}body.layer.contained #ruler{overflow:hidden} #rail{transition:left 320ms cubic-bezier(.2,.8,.2,1)}@media(prefers-reduced-motion:reduce){#rail{transition:none}}body.auto #rail{position:fixed;left:auto!important;right:calc(8px + env(safe-area-inset-right));top:50%;bottom:auto;transform:translateY(-50%);transition:none} @media (orientation:portrait){body.auto:not(.folded) #rail{left:50%!important;right:auto;top:auto;bottom:calc(8px + env(safe-area-inset-bottom));width:max-content;grid-auto-flow:column;transform:translateX(-50%)}} body.auto #canvas{position:fixed;width:100%!important;height:100dvh;transform:none}body.auto,html:has(body.auto){overflow:hidden} </style></head><body><div id="canvas"><div id="ruler"></div></div><main><h1>FORM · Calibration</h1><small id="build">Build 35</small><pre id="metrics"></pre><label>Canvas width <output id="cw"></output><input id="width" type="range" min="300" max="1100" step="1"></label><label>Rail center X (Auto reference restores edge) <output id="rx"></output><input id="x" type="range" min="30" max="1070" step="1"></label><div><button id="contain">Overflow: Visible</button> <button id="layer">Layer: Fixed</button> <button id="reset">Auto reference</button> <button id="copy">Copy readings</button></div><p id="hit">Tap a rail button to test.</p><button id="check">Check updates</button> <button id="reload">Reload</button></main><div id="rail"><button aria-label="Home">1</button><button aria-label="Workouts">2</button><button aria-label="Progress">3</button><button aria-label="Profile">4</button></div><div id="touch"></div><div id="probe"></div><script>
const BUILD=35;const $=id=>document.getElementById(id);let mode='',autoRail=true;function edge(){return reference()-29-8}function reference(){const w=document.documentElement.clientWidth,h=document.documentElement.clientHeight;return w>h?w:w>=550?669:466}function reset(){ $('width').value=reference();autoRail=true;document.body.classList.add('auto');$('x').value=edge();draw()}function draw(){const w=+$('width').value,x=autoRail?edge():+$('x').value;$('x').value=x;document.body.style.setProperty('--test-width',w+'px');$('canvas').style.width=w+'px';$('rail').style.left=x+'px';$('cw').textContent=w;$('rx').textContent=x;$('ruler').replaceChildren();for(let i=0;i<w;i+=50){let s=document.createElement('span');s.style.left=i+'px';s.textContent=i;$('ruler').append(s)}measure()}function measure(){const v=visualViewport,r=$('rail').getBoundingClientRect(),p=getComputedStyle($('probe'));$('metrics').textContent='Screen '+screen.width+' × '+screen.height+'\nInner '+innerWidth+' × '+innerHeight+'\nClient '+document.documentElement.clientWidth+' × '+document.documentElement.clientHeight+'\nVisual '+(v?v.width.toFixed(1)+' × '+(v.height>0?v.height.toFixed(1):'invalid'):'n/a')+'\nScale '+(v?.scale??1)+' · Offset '+(v?.offsetLeft??0)+','+(v?.offsetTop??0)+'\nSafe T/R/B/L '+[p.paddingTop,p.paddingRight,p.paddingBottom,p.paddingLeft].join('/')+'\nRail bounds '+Math.round(r.left)+'–'+Math.round(r.right)+' · Center '+Math.round(r.left+r.width/2)}function resize(){const w=document.documentElement.clientWidth,h=document.documentElement.clientHeight;const folded=w<h&&w<=500&&Math.min(screen.width,screen.height)/Math.max(screen.width,screen.height)>.62;document.body.classList.toggle('folded',folded);const m=reference();if(m!==mode){mode=m;const landscape=document.documentElement.clientWidth>document.documentElement.clientHeight;document.body.classList.remove('layer');document.body.classList.remove('contained');$('layer').textContent='Layer: Fixed';$('contain').textContent='Overflow: Visible';reset()}else if(autoRail&&+$('x').value!==edge())draw();else measure()}$('contain').onclick=()=>{autoRail=false;document.body.classList.remove('auto');const active=document.body.classList.toggle('contained');$('contain').textContent=active?'Overflow: Contained':'Overflow: Visible';draw()};$('layer').onclick=()=>{autoRail=false;document.body.classList.remove('auto');const active=document.body.classList.toggle('layer');$('layer').textContent=active?'Layer: Composited':'Layer: Fixed';draw()};$('width').oninput=()=>{autoRail=false;document.body.classList.remove('auto');draw()};$('x').oninput=()=>{autoRail=false;document.body.classList.remove('auto');draw()};$('reset').onclick=reset;$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('metrics').textContent+'\n'+$('hit').textContent);$('hit').textContent='Readings copied'}catch{$('hit').textContent='Copy unavailable; take a screenshot'}};document.querySelectorAll('#rail button').forEach(b=>b.onclick=()=>{b.classList.toggle('hit');$('hit').textContent='Received: '+b.getAttribute('aria-label')});document.addEventListener('pointerdown',e=>{const t=$('touch');t.style.display='block';t.style.left=e.clientX-8+'px';t.style.top=e.clientY-8+'px';$('hit').textContent='Touch '+e.clientX.toFixed(0)+','+e.clientY.toFixed(0)});$('reload').onclick=()=>{location.replace(location.pathname+'?refresh='+Date.now())};$('check').onclick=async()=>{try{const t=await(await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'})).text();const n=+(t.match(/const BUILD=(\d+)/)?.[1]||0);$('build').textContent=n>BUILD?'Build '+n+' available · Reload':'Build '+BUILD+' · Up to date'}catch{$('build').textContent='Update check unavailable'}};if(location.search)history.replaceState(null,'',location.pathname);addEventListener('resize',resize);visualViewport?.addEventListener('resize',resize);resize();setInterval(resize,1000);
</script></body></html>
