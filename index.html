<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#17171f"><title>FORM</title><style>:root{color-scheme:dark;--canvas:#17171f;--surface:#24242e;--raised:#30303c;--ink:#f5f5f5;--muted:#a3a3ad;--accent:#c2fa54;--on-accent:#171a12;--radius-card:20px;--radius-control:12px;--radius-pill:999px;--card-padding:16px;--card-gap:16px;--motion-duration:320ms;--motion-ease:cubic-bezier(.2,.8,.2,1)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:var(--canvas);color:var(--ink);font:15px -apple-system,BlinkMacSystemFont,sans-serif;overflow:hidden}button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}svg{width:22px;height:22px;display:block;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}main{position:fixed;inset:0;overflow:auto;padding:calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(94px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));scrollbar-width:none;overscroll-behavior:contain;touch-action:pan-y;-webkit-overflow-scrolling:touch}main::-webkit-scrollbar{display:none}.page{max-width:960px;margin:auto;min-width:0}.brand{font-size:34px;font-weight:800;letter-spacing:-1.8px;margin:0}.brand-mark{color:var(--accent)}.tagline{margin:3px 0 0 2px;color:var(--muted);font-size:13px}.nav{position:fixed;z-index:5;bottom:calc(8px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:4px;padding:5px;border:1px solid #ffffff25;border-radius:var(--radius-pill);background:#30303ce8;backdrop-filter:blur(20px);max-width:calc(100% - 16px)}.nav button{width:48px;height:48px;min-width:44px;min-height:44px;display:grid;place-items:center;background:transparent;border-radius:50%;color:var(--muted);transition:background 200ms,color 200ms}.nav button[aria-current=page]{background:var(--accent);color:var(--on-accent)}body[data-dock=side] main{padding-right:calc(82px + env(safe-area-inset-right));padding-bottom:calc(16px + env(safe-area-inset-bottom))}body[data-dock=side] .nav{left:auto;right:calc(8px + env(safe-area-inset-right));top:50%;bottom:auto;transform:translateY(-50%);flex-direction:column}body[data-layout=folded-portrait]{--portrait-gutter:clamp(10px,3vw,16px);--portrait-dock-width:60px;--portrait-dock-center:429px;--portrait-dock-gap:8px}body[data-layout=folded-portrait] main{width:100%;padding-left:calc(var(--portrait-gutter) + env(safe-area-inset-left));padding-right:calc(max(0px,100% - var(--portrait-dock-center) + var(--portrait-dock-width)/2 + var(--portrait-dock-gap)) + env(safe-area-inset-right))}body[data-layout=folded-portrait] .nav{position:absolute;left:var(--portrait-dock-center);right:auto;transform:translate3d(-50%,-50%,0)}body[data-layout=folded-portrait]{overflow:visible}html:has(body[data-layout=folded-portrait]){overflow:visible}.proxy{display:none}body[data-layout=folded-portrait] .proxy{display:flex;position:fixed;right:0;top:50%;transform:translateY(-50%);flex-direction:column;z-index:6;opacity:0}.proxy button{width:48px;height:48px}.foot,.diagnostic-caption{font-size:12px;color:var(--muted)}.diagnostic-row{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #ffffff15;font-size:12px}.diagnostic-row span{color:var(--muted)}.diagnostic-row strong{text-align:right}.diagnostic-card{background:var(--surface);border-radius:var(--radius-card);padding:16px}.diagnostic-marker{padding:16px;margin-top:10px;background:var(--raised);border-radius:12px}#check-update,.dev-dialog button{min-height:44px;padding:0 14px;border-radius:12px;background:var(--raised);width:100%;margin-top:10px}.dev-dialog{color:var(--ink);background:var(--surface);border:1px solid var(--raised);border-radius:20px;padding:18px;width:min(320px,90%)}.dev-dialog::backdrop{background:#0008}.dev-dialog input{accent-color:var(--acce const glyphs={home:'M3 11 12 3l9 8v9h-6v-7H9v7H3z',workouts:'M3 10h18v4H3zM7 6v12M17 6v12',progress:'M3 20h18M5 15l4-5 4 3 6-9',profile:'M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8M4 21v-2a8 8 0 0 1 16 0v2',exercise:'M3 10h18v4H3zM6 7v10M18 7v10',timer:'M12 7v6l4 2M9 2h6M12 4a9 9 0 1 0 0 18 9 9 0 0 0 0-18',records:'M5 20V9h14v11M8 9V5h8v4M9 14h6',library:'M4 4h6v16H4zM14 4h6v16h-6z',plus:'M12 4v16M4 12h16',swap:'M4 7h15l-4-4m5 14H5l4 4',rest:'M4 3h16v18H4zM8 8h8M8 12h8M8 16h5',calendar:'M3 5h18v16H3zM7 3v4m10-4v4M3 10h18',heart:'M20 8c0 5-8 11-8 11S4 13 4 8a4 4 0 0 1 8-1 4 4 0 0 1 8 1'};
const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="'+(glyphs[n]||glyphs.exercise)+'"/></svg>';
const main=document.querySelector('main'),nav=document.querySelector('.nav'),proxy=document.querySelector('.proxy'),dev=document.querySelector('#developer');
let page='Home',taps=0,showDiagnostics=false,dockRects=null,dockMode='',dockAnimations=[],checking=false;try{showDiagnostics=localStorage.getItem('form.diagnostics')==='true'}catch{}
function layout(){const w=document.documentElement.clientWidth,h=document.documentElement.clientHeight,s=Math.min(w,h),l=Math.max(w,h),ratio=Math.min(screen.width,screen.height)/Math.max(screen.width,screen.height),duo=ratio>.62,folded=duo&&s<=530&&l<=760,mode=folded?'folded-'+(w>h?'landscape':'portrait'):duo?'unfolded-'+(w>h?'landscape':'portrait'):'standard-'+(w>h?'landscape':'portrait');document.body.dataset.layout=mode;document.body.dataset.dock=folded||w>h?'side':'bottom';document.body.dataset.posture=navigator.devicePosture?.type||(matchMedia('(device-posture: folded)').matches?'folded':'unknown');const nextMode=mode+':'+document.body.dataset.posture,nodes=[nav,...nav.querySelectorAll('button')];if(nextMode!==dockMode){dockAnimations.forEach(a=>a.cancel());dockAnimations=[];const next=nodes.map(n=>n.getBoundingClientRect());if(dockRects&&!matchMedia('(prefers-reduced-motion: reduce)').matches){nodes.forEach((n,i)=>{const a=dockRects[i],b=next[i];if(!a||!b.width||!b.height)return;const dx=a.left+a.width/2-b.left-b.width/2,dy=a.top+a.height/2-b.top-b.height/2,parent=i?{x:dockRects[0].left+dockRects[0].width/2-next[0].left-next[0].width/2,y:dockRects[0].top+dockRects[0].height/2-next[0].top-next[0].height/2}:{x:0,y:0};const frames=i?[{translate:(dx-parent.x)+'px '+(dy-parent.y)+'px'},{translate:'0px 0px'}]:[{translate:dx+'px '+dy+'px'},{translate:'0px 0px'}];dockAnimations.push(n.animate(frames,{duration:320,easing:'cubic-bezier(.2,.8,.2,1)'}))})}dockRects=next;dockMode=nextMode}else if(!dockAnimations.some(a=>a.playState==='running'))dockRects=nodes.map(n=>n.getBoundingClientRect());diagnostics()}
function diagnostics(){const box=document.querySelector('#diagnostics');if(!box)return;const v=visualViewport,n=nav.getBoundingClientRect(),m=main.getBoundingClientRect(),s=getComputedStyle(main),values=[['Layout',document.body.dataset.layout],['Posture',document.body.dataset.posture],['Dock',document.body.dataset.dock],['Layout viewport',innerWidth+' × '+innerHeight],['Visual viewport',v?Math.round(v.width)+' × '+Math.round(v.height):'Unavailable'],['Scale',v?v.scale.toFixed(3):'Unavailable'],['Screen',screen.width+' × '+screen.height],['Content',Math.round(m.width)+' × '+Math.round(m.height)],['Padding',s.padding],['Navigation',[n.x,n.y,n.width,n.height].map(Math.round).join(' / ')],['Navigation taps',taps],['Scroll',Math.round(main.scrollTop)+' px']];box.replaceChildren(...values.map(([k,v])=>{const row=document.createElement('div');row.className='diagnostic-row';row.innerHTML='<span></span><strong></strong>';row.firstChild.textContent=k;row.lastChild.textContent=v;return row}))}
function render(){if(showDiagnostics){main.innerHTML='<div class="page enter"><h1 class="brand">FORM · Diagnostics</h1><p class="diagnostic-caption">Navigation and viewport test</p><section class="diagnostic-card"><h2>Live diagnostics</h2><div id="diagnostics"></div></section><button id="check-update">Check for Updates</button><p class="foot"></p><section class="diagnostic-card" style="margin-top:12px"><h2>Scroll test</h2><p>Navigation stays stationary while content scrolls.</p>'+Array.from({length:12},(_,i)=>'<div class="diagnostic-marker">Scroll marker '+(i+1)+'</div>').join('')+'</section></div>'}else{const content=page==='Home'?'<h1 class="brand">FORM<span class="brand-mark">.</span></h1><p class="tagline">Train with focus, follow your progress</p>':'<h1 class="brand">'+page+'</h1><p class="tagline">This page will be designed after Home.</p>';main.innerHTML='<div class="page enter">'+content+'<p class="foot"></p></div>'}nav.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-current',tabs[i]===page?'page':'false'));layout()}
function go(t){taps++;if(page!==t){page=t;render()}}
nav.innerHTML=tabs.map((t,i)=>'<button aria-label="'+t+'" title="'+t+'" data-go="'+t+'">'+icon(['home','workouts','progress','profile'][i])+'</button>').join('');proxy.innerHTML=tabs.map(t=>'<button tabindex="-1" data-go="'+t+'">'+t+'</button>').join('');
function openDeveloper(){dev.innerHTML='<h2>Developer settings</h2><label>Show diagnostics <input type="checkbox" id="show-diagnostics" '+(showDiagnostics?'checked':'')+'></label><p>Build '+BUILD+'</p><button id="dev-update">Check for Updates</button><button id="dev-close">Done</button>';dev.showModal()}
let holdTimer=null,held=false,origin=null;function cancelHold(){clearTimeout(holdTimer);holdTimer=null}
document.addEventListener('pointerdown',e=>{if(!e.target.closest('button[data-go="Profile"]'))return;held=false;origin=[e.clientX,e.clientY];cancelHold();holdTimer=setTimeout(()=>{held=true;openDeveloper()},3000)});document.addEventListener('pointermove',e=>{if(origin&&Math.hypot(e.clientX-origin[0],e.clientY-origin[1])>12)cancelHold()});for(const ev of ['pointerup','pointercancel','lostpointercapture'])document.addEventListener(ev,()=>{cancelHold();origin=null});document.addEventListener('contextmenu',e=>{if(e.target.closest('button[data-go="Profile"]'))e.preventDefault()});document.addEventListener('click',e=>{if(held&&e.target.closest('button[data-go="Profile"]')){held=false;e.preventDefault();e.stopImmediatePropagation()}},true);
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go){go(b.dataset.go);return}if(b.id==='check-update'||b.id==='dev-update'){update(true);return}if(b.id==='dev-close')dev.close()});dev.addEventListener('change',e=>{if(e.target.id==='show-diagnostics'){showDiagnostics=e.target.checked;try{localStorage.setItem('form.diagnostics',String(showDiagnostics))}catch{}render()}});
addEventListener('resize',layout);visualViewport?.addEventListener('resize',layout);navigator.devicePosture?.addEventListener('change',layout);matchMedia('(device-posture: folded)').addEventListener('change',layout);main.addEventListener('scroll',diagnostics,{passive:true});
async function update(manual=false){if(checking||(!manual&&document.hidden))return;checking=true;const button=dev.open?document.getElementById('dev-update'):document.getElementById('check-update');if(manual&&button)button.textContent='Checking…';try{const url=new URL('index.html',location.href);url.searchParams.set('check',Date.now());const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const source=await response.text(),latest=Number(source.match(/const BUILD=(\\d+)/)?.[1]);if(!latest)throw Error('Build not found');if(latest>BUILD){if(button)button.textContent='Updating to Build '+latest;const target=new URL(location.pathname,location.origin);target.searchParams.set('refresh',Date.now());location.replace(target.href)}else if(manual&&button)button.textContent='Build '+BUILD+' · Up to Date'}catch{if(manual&&button)button.textContent='Check Failed · Try Again'}finally{checking=false}}
addEventListener('pageshow',()=>update());addEventListener('focus',()=>update());document.addEventListener('visibilitychange',()=>update());addEventListener('online',()=>update());setInterval(()=>update(),5000);render();update();</script></body></html>
