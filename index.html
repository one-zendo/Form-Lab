case 'import-confirm':{const f=document.getElementById('backup-file').files[0];if(!f){notice('Choose a backup file');break}f.text().then(t=>{const d=JSON.parse(t);if(d.version!==1||!Array.isArray(d.routines)||!Array.isArray(d.history)||!Array.isArray(d.custom)||!d.settings||![...d.routines,...d.history,...(d.active?[d.active]:[])].every(w=>typeof w.name==='string'&&Array.isArray(w.exercises)&&w.exercises.every(e=>typeof e.name==='string'&&Array.isArray(e.sets)&&e.sets.every(s=>Number.isFinite(s.weight)&&Number.isFinite(s.reps)))))throw Error('Invalid backup');data=d;storageError=false;save();draft=null;view='list';closeSheet();refresh();notice('Backup imported')}).catch(()=>notice('Invalid backup'));break}
}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&!gestureSuppress)action(b.dataset.act)});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='routine-query'){query=t.value;document.getElementById('routine-results').innerHTML=routineResults();window.lucide?.createIcons()}if(t.id==='exercise-query')pickerResults();if(t.id==='draft-name'&&draft)draft.name=t.value;if(t.id==='draft-notes'&&draft)draft.notes=t.value;if(t.dataset.field){const [i,j,k]=t.dataset.field.split(':');const r=target();if(r){r.exercises[i].sets[j][k]=num(t.value);if(view==='active')save()}}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='muscle-filter')pickerResults();if(t.id==='theme'){data.settings.theme=t.value;save();refresh()}if(t.id==='units'){const old=data.settings.unit;if(old!==t.value){const factor=t.value==='lb'?2.2046226218:1/2.2046226218;for(const w of [...data.routines,...data.history,...(data.active?[data.active]:[]),...(draft?[draft]:[])])for(const ex of w.exercises)for(const s of ex.sets)s.weight=Math.round(s.weight*factor*100)/100;data.settings.unit=t.value;save();refresh()}}if(t.id==='default-rest'){data.settings.rest=num(t.value);save()}if(t.id==='auto-rest'){data.settings.auto=t.checked;save()}if(t.dataset.restDay!==undefined){const i=Number(t.dataset.restDay);data.settings.restDays=data.settings.restDays.filter(d=>d!==i);if(t.checked)data.settings.restDays.push(i);save();refresh()}});
/* Shared pointer gestures; horizontal swipe and handle-only reorder. */
let gesture=null,gestureSuppress=false;
document.addEventListener('pointerdown',e=>{const row=e.target.closest('.swipe');if(!row||e.target.closest('input,textarea,select'))return;const drag=e.target.closest('[data-drag]');gesture={row,face:row.querySelector('.swipe-face'),x:e.clientX,y:e.clientY,drag:!!drag,started:false,id:e.pointerId,base:row.classList.contains('revealed')?-84:0};if(drag){e.preventDefault();drag.setPointerCapture(e.pointerId);gesture.started=true;row.classList.add('lifting')}});
document.addEventListener('pointermove',e=>{const g=gesture;if(!g||g.id!==e.pointerId)return;const dx=e.clientX-g.x,dy=e.clientY-g.y;if(g.drag){g.row.style.transform='translateY('+dy+'px)';return}if(!g.started&&Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){gesture=null;return}if(Math.abs(dx)>12){g.started=true;g.face.style.transition='none';g.face.style.transform='translateX('+Math.max(-84,Math.min(0,g.base+dx))+'px)'}});
function endGesture(e,cancel=false){const g=gesture;if(!g)return;gesture=null;if(!g.started)return;gestureSuppress=true;setTimeout(()=>gestureSuppress=false,300);if(g.drag){g.row.style.transform='';g.row.classList.remove('lifting');if(cancel)return;const siblings=[...g.row.parentElement.children].filter(el=>el.classList.contains('swipe')),from=siblings.indexOf(g.row);const to=siblings.reduce((best,el,i)=>Math.abs(el.getBoundingClientRect().top+el.offsetHeight/2-e.clientY)<Math.abs(siblings[best].getBoundingClientRect().top+siblings[best].offsetHeight/2-e.clientY)?i:best,from);const arr=g.row.dataset.kind==='routine'?data.routines:target()?.exercises;if(arr&&from!==to){const source=g.row.dataset.kind==='routine'?arr.findIndex(r=>r.id===g.row.dataset.id):Number(g.row.dataset.id);const dest=g.row.dataset.kind==='routine'?arr.findIndex(r=>r.id===siblings[to].dataset.id):Number(siblings[to].dataset.id);arr.splice(dest,0,arr.splice(source,1)[0]);if(!draft||view==='active')save();refresh()}}else{g.face.style.transition='';g.face.style.transform='';g.row.classList.toggle('revealed',cancel?g.base<0:g.base+e.clientX-g.x<-40)}}
document.addEventListener('pointerup',e=>endGesture(e));document.addEventListener('pointercancel',e=>endGesture(e,true));

// Deployment update checks
let checking=false;async function update(manual=false){if(checking||(!manual&&document.hidden))return;checking=true;const button=dev.open?document.getElementById('dev-update'):document.getElementById('check-update');if(manual&&button)button.textContent='Checking…';try{const url=new URL('index.html',location.href);url.searchParams.set('check',Date.now());const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const source=await response.text();const latest=Number(source.match(/const BUILD=(\d+)/)?.[1]);if(!latest)throw Error('Build not found');if(latest>BUILD){if(button)button.textContent='Updating to Build '+latest;const target=new URL(location.pathname,location.origin);target.searchParams.set('refresh',Date.now());location.replace(target.href)}else if(manual&&button)button.textContent='Build '+BUILD+' · Up to Date'}catch{if(manual&&button)button.textContent='Check Failed · Try Again'}finally{checking=false}}addEventListener('pageshow',()=>update());addEventListener('focus',()=>update());document.addEventListener('visibilitychange',()=>update());addEventListener('online',()=>update());setInterval(()=>update(),5000);render();update();
</script></body></html>
