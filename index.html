<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#17171F"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>FORM Display Lab</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#17171f;color:#f5f5f5;font-family:Inter,-apple-system,BlinkMacSystemFont,sans-serif}main{width:100%;height:100vh;height:100dvh;position:relative;overflow:auto;padding:16px;padding:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) calc(16px + env(safe-area-inset-left,0px));background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:24px 24px}.edges{position:fixed;inset:0;pointer-events:none;z-index:3;border:3px solid;border-color:#b0ff00 #0088ff #ff8d28 #b02fc2}.brand{display:flex;align-items:center;gap:10px;font-size:28px;font-weight:700}.brand:before{content:'';width:3px;height:27px;border-radius:3px;background:#b0ff00}h1{font-size:17px;margin:8px 0;color:#a3a3a3}section{background:#24242e;padding:16px;border-radius:20px;min-width:0}#size{font-size:clamp(28px,8vw,64px);font-weight:700;font-variant-numeric:tabular-nums;color:#b0ff00;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));gap:12px;margin:12px 0}small{color:#a3a3a3;display:block;margin-bottom:6px}output{font-variant-numeric:tabular-nums;overflow-wrap:anywhere}button{min-height:44px;border:0;border-radius:12px;background:#b0ff00;color:#17171f;font:inherit;font-weight:600;padding:12px 16px;cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:3px}p{font-size:13px;line-height:1.5;color:#a3a3a3}#probe{position:fixed;visibility:hidden;pointer-events:none;padding:env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px)}body.solid main{background:#0088ff}body.solid .content{visibility:hidden}body.solid .edges{display:none}#exit{display:none;position:fixed;bottom:calc(16px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);z-index:4}body.solid #exit{display:block}@media(orientation:landscape) and (min-width:760px){.content{display:grid;grid-template-columns: minmax(0,1fr) minmax(0,1fr);gap:16px}.grid{margin:0}} 
</style></head><body><main id="page"><div class="content"><div><div class="brand">FORM</div><h1>Display Lab</h1><section><small>Live viewport · CSS pixels</small><div id="size"></div><output id="orientation"></output></section><p>Edge markers: lime top · blue right · amber bottom · purple left.</p><button id="solid">Solid Color Test</button> <button id="copy">Copy Measurements</button><p id="status" role="status"></p></div><div><div class="grid" id="metrics"></div><p>Fold, unfold or rotate. Measurements update automatically. Browser chrome may reserve space outside the web viewport.</p></div></div></main><div class="edges" aria-hidden="true"></div><div id="probe"></div><button id="exit">Exit Color Test</button><script>
const el=id=>document.getElementById(id);let report='';function update(){const v=window.visualViewport,r=el('page').getBoundingClientRect(),s=getComputedStyle(el('probe')),n=x=>Math.round(x*100)/100;const rows=[['Screen (CSS px)',screen.width+' × '+screen.height],['Device pixel ratio',devicePixelRatio],['Estimated screen pixels',Math.round(screen.width*devicePixelRatio)+' × '+Math.round(screen.height*devicePixelRatio)],['Layout viewport',document.documentElement.clientWidth+' × '+document.documentElement.clientHeight],['Visual viewport',v?n(v.width)+' × '+n(v.height):'Unavailable'],['Visual offset / zoom',v?n(v.offsetLeft)+', '+n(v.offsetTop)+' / '+n(v.scale):'Unavailable'],['Page bounds',n(r.width)+' × '+n(r.height)],['Safe area T / R / B / L',[s.paddingTop,s.paddingRight,s.paddingBottom,s.paddingLeft].join(' / ')],['Horizontal overflow',Math.max(0,document.documentElement.scrollWidth-document.documentElement.clientWidth)+' px'],['Display mode',matchMedia('(display-mode: standalone)').matches||navigator.standalone?'Standalone':'Browser']];el('size').textContent=innerWidth+' × '+innerHeight;el('orientation').textContent=(innerWidth>innerHeight?'Landscape':'Portrait')+' · '+n(innerWidth/innerHeight)+' aspect ratio';el('metrics').replaceChildren(...rows.map(([k,val])=>{let a=document.createElement('section'),b=document.createElement('small'),c=document.createElement('output');b.textContent=k;c.textContent=val;a.append(b,c);return a}));report=[el('size').textContent,el('orientation').textContent,...rows.map(x=>x.join(': '))].join('\n')}addEventListener('resize',update);addEventListener('pageshow',update);window.visualViewport?.addEventListener('resize',update);window.visualViewport?.addEventListener('scroll',update);screen.orientation?.addEventListener('change',update);new ResizeObserver(update).observe(el('page'));el('solid').onclick=()=>{document.body.classList.add('solid');el('exit').focus()};el('exit').onclick=()=>{document.body.classList.remove('solid');el('solid').focus()};el('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report);el('status').textContent='Measurements copied.'}catch{el('status').textContent='Clipboard unavailable. Take a screenshot instead.'}};update();
</script></body></html>
