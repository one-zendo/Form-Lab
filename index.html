-width:100%;max-height:90dvh;margin:auto auto 0;color:var(--ink);background:white;box-shadow:0 -8px 60px #17223822;animation:slide var(--motion)}dialog::backdrop{background:#17223866;backdrop-filter:blur(4px)}label{display:block;font-size:12px;color:var(--muted);margin:12px 0}input,select{width:100%;min-width:0;border:1px solid #dfe4ec;border-radius:12px;background:#f7f8fb;color:var(--ink);padding:12px;margin-top:6px}.handle{width:32px;height:4px;background:#d8dce5;border-radius:4px;margin:0 auto 18px}.chart{display:flex;align-items:flex-end;height:120px;gap:8px;margin:16px 0}.chart div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:5px}.chart i{width:70%;max-width:40px;background:#8278ef;border-radius:6px 6px 2px 2px;min-height:3px}.chart span{font-size:10px;color:var(--muted)}.empty{text-align:center;padding:22px;color:var(--muted)}.page{animation:appear var(--motion)}.build{font-size:10px;color:var(--muted);margin-top:24px}@keyframes slide{from{transform:translateY(100%)}to{transform:none}}@keyframes appear{from{opacity:.5;transform:translateY(5px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body><main id="app"></main><nav id="nav" aria-label="Main navigation"></nav><dialog id="sheet"></dialog><script>
const BUILD=64;
const glyphs={house:'<path d="M3 11 12 3l9 8v8a2 2 0 0 1-2 2h-4v-7H9v7H5a2 2 0 0 1-2-2Z"/>',list:'<rect x="3" y="4" width="5" height="5" rx="2"/><rect x="3" y="15" width="5" height="5" rx="2"/><rect x="10" y="5" width="11" height="3" rx="1.5"/><rect x="10" y="16" width="8" height="3" rx="1.5"/>',wallet:'<path fill-rule="evenodd" d="M5 4h13a3 3 0 0 1 3 3v2h-6a4 4 0 0 0 0 8h6v1a3 3 0 0 1-3 3H5a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3Zm10 7h7v4h-7a2 2 0 0 1 0-4Z"/>',target:'<path fill-rule="evenodd" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 4a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/><circle cx="12" cy="12" r="3"/>','chart-no-axes-combined':'<rect x="3" y="13" width="5" height="8" rx="2.5"/><rect x="9.5" y="8" width="5" height="13" rx="2.5"/><rect x="16" y="3" width="5" height="18" rx="2.5"/>',settings:'<path fill-rule="evenodd" d="M9 2h6l1 4 4 1 2 5-3 3v4l-5 3-3-3-4 1-4-4 1-4-2-3 3-5 4 1Zm3 6a4 4 0 1 0 0 8 4 4 0 0 0 0-8Z"/>',plus:'<rect x="10" y="3" width="4" height="18" rx="2"/><rect x="3" y="10" width="18" height="4" rx="2"/>',ellipsis:'<circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/>','shopping-cart':'<path d="M2 4h4l2 3h13l-3 9H8L5 7H2Z"/><circle cx="9" cy="20" r="2"/><circle cx="17" cy="20" r="2"/>',car:'<path fill-rule="evenodd" d="m5 5 2-2h10l2 2 3 7v7h-4v-2H6v2H2v-7Zm2 2-2 5h14l-2-5Z"/>',coffee:'<path fill-rule="evenodd" d="M3 6h15v2h2a4 4 0 0 1 0 8h-3a7 7 0 0 1-14-3Zm15 5v2h2a1 1 0 0 0 0-2Z"/><rect x="3" y="21" width="17" height="2" rx="1"/>','shopping-bag':'<path fill-rule="evenodd" d="M7 7V5a5 5 0 0 1 10 0v2h4l1 14H2L3 7Zm3 0h4V5a2 2 0 0 0-4 0Z"/>',repeat:'<path d="m16 2 6 6-6 6V10H5v3H2V9a3 3 0 0 1 3-3h11Zm-8 8-6 6 6 6v-4h11a3 3 0 0 0 3-3v-4h-3v3H8Z"/>'};
const $=s=>document.querySelector(s),icons=()=>{},ic=n=>'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">'+(glyphs[n]||glyphs.ellipsis)+'</svg>',esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),id=()=>crypto.randomUUID?.()||String(Date.now()+Math.random()),date=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-'),today=()=>date(new Date()),month=()=>today().slice(0,7),money=n=>new Intl.NumberFormat('en-CA',{style:'currency',currency:'CAD'}).format(n/100),cats={Housing:['#7063e9','house'],Groceries:['#1caa88','shopping-cart'],Transport:['#4594ef','car'],Dining:['#e9a044','coffee'],Shopping:['#df75ad','shopping-bag'],Subscriptions:['#a17de0','repeat'],Other:['#8794a9','ellipsis'],Income:['#169c79','wallet']},limits={Housing:150000,Groceries:50000,Transport:18000,Dining:20000,Shopping:25000,Subscriptions:8000,Other:15000};
function seed(){let tx=[];for(let k=2;k>=0;k--){let d=new Date();d.setDate(1);d.setMonth(d.getMonth()-k);let m=date(d).slice(0,7),last=k?28:Number(today().slice(-2));[['Monthly salary','Income',420000,1],['Apartment rent','Housing',-145000,1],['Grocery market','Groceries',-12480,3],['Transit pass','Transport',-12600,2],['Coffee shop','Dining',-850,4],['Weekly groceries','Groceries',-18740,10],['Streaming services','Subscriptions',-2499,5],['New clothes','Shopping',-8999,12],['Dinner out','Dining',-6500,16]].forEach(([name,cat,amount,day])=>{if(day<=last)tx.push({id:id(),name,cat,amount,date:m+'-'+String(day).padStart(2,'0'),sample:true})})}return {version:1,tx,budgets:{...limits},goals:[{id:id(),name:'Emergency fund',target:500000,saved:185000,sample:true},{id:id(),name:'Travel fund',target:200000,saved:64000,sample:true}]}}
let data=seed(),storage=true;try{let raw=localStorage.getItem('balance.lab.v1');if(raw){let p=JSON.parse(raw);if(p.version===1&&Array.isArray(p.tx)&&Array.isArray(p.goals)&&p.budgets)data=p;else throw Error('Invalid data')}else localStorage.setItem('balance.lab.v1',JSON.stringify(data))}catch{storage=false}
function save(){if(storage)try{localStorage.setItem('balance.lab.v1',JSON.stringify(data))}catch{storage=false}}
let tab='Overview',period=month(),filter='All',modal='',editId=null,kind='Expense';const tabs=['Overview','Activity','Budgets','Goals','Insights'],navicons=['house','list','wallet','target','chart-no-axes-combined'],tx=()=>data.tx.filter(t=>t.date.slice(0,7)===period),spent=c=>tx().filter(t=>t.amount<0&&(!c||t.cat===c)).reduce((a,t)=>a-t.amount,0),income=()=>tx().filter(t=>t.amount>0).reduce((a,t)=>a+t.amount,0),budget=()=>Object.values(data.budgets).reduce((a,b)=>a+b,0),row=(a,b)=>'<div class="row">'+a+b+'</div>',card=s=>'<article class="card">'+s+'</article>',btn=(s,a,cls='secondary')=>'<button type="button" class="'+cls+'" data-a="'+esc(a)+'">'+s+'</button>',tile=c=>'<div class="tile" style="background:'+cats[c][0]+'18;color:'+cats[c][0]+'">'+ic(cats[c][1])+'</div>',track=(v,max,color)=>'<div class="track"><i style="width:'+Math.min(100,Math.max(0,max?v/max*100:v?100:0))+'%;background:'+color+'"></i></div>';
function trans(t){return '<div class="transaction">'+tile(t.cat)+'<div style="flex:1;min-width:0"><strong>'+esc(t.name)+'</strong><span class="small">'+esc(t.cat)+' · '+t.date.slice(5)+(t.sample?' · Sample':'')+'</span></div><span class="amount" style="color:'+(t.amount>0?'var(--green)':'inherit')+'">'+(t.amount>0?'+':'−')+money(Math.abs(t.amount))+'</span>'+btn(ic('ellipsis'),'edit:'+t.id,'secondary')+'</div>'}
function ring(){let total=spent(),p=0,stops=[];Object.keys(data.budgets).forEach(c=>{let v=total?spent(c)/total*100:0;stops.push(cats[c][0]+' '+p+'% '+(p+v)+'%');p+=v});return '<div class="ring" style="background:'+(total?'conic-gradient('+stops.join(',')+')':'#edf0f5')+'"><div class="ringinner"><span class="small">Spent</span><strong>'+money(total)+'</strong></div></div>'}
function overview(){let remaining=income()-spent();return '<div class="hero"><span class="small">Available this month</span><div class="money">'+money(remaining)+'</div><div class="split"><div><span class="small">Income</span><strong>'+money(income())+'</strong></div><div><span class="small">Expenses</span><strong>'+money(spent())+'</strong></div></div></div><div class="grid">'+card('<h2>Monthly budget</h2><strong style="font-size:24px">'+money(budget()-spent())+'</strong><p>Remaining spending allowance</p>'+track(spent(),budget(),'#6459e9')+'<p>'+Math.round(spent()/Math.max(1,budget())*100)+'% of planned spending used</p>')+card('<h2>Spending breakdown</h2>'+ring())+'</div><div class="notice '+(remaining<0?'warn':'')+'">'+(remaining>=0?'You have money remaining after recorded expenses.':'Recorded expenses exceed income.')+'</div><div class="section">'+row('<h2>Recent activity</h2>',btn('View all','tab:Activity'))+'</div>'+card(tx().slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,4).map(trans).join('')||'<p class="empty">No transactions this month.</p>')}
function activity(){let list=tx().filter(t=>filter==='All'||(filter==='Income'?t.amount>0:t.amount<0)).sort((a,b)=>b.date.localeCompare(a.date));return '<div class="seg">'+['All','Income','Expenses'].map(f=>btn(f,'filter:'+f,f===filter?'active':'')).join('')+'</div>'+card(list.map(trans).join('')||'<p class="empty">No matching transactions.</p>')}
function budgets(){return '<div class="hero"><span class="small">Planned monthly spending</span><div class="money">'+money(budget())+'</div><span class="small">'+money(budget()-spent())+' remaining</span></div><div class="grid">'+Object.entries(data.budgets).map(([c,b])=>card(row(tile(c),btn('Edit','budget:'+c))+'<h2 style="margin-top:14px">'+c+'</h2>'+row('<strong>'+money(spent(c))+'</strong>','<span class="small">of '+money(b)+'</span>')+track(spent(c),b,spent(c)>b?'#d84a59':cats[c][0])+'<p>'+money(Math.abs(b-spent(c)))+(b>=spent(c)?' left':' over budget')+'</p>')).join('')+'</div>'}
function goals(){return '<p>Make room for what matters to you.</p><div class="section">'+btn('Create savings goal','goal','primary full')+'</div><div class="grid">'+data.goals.map(g=>card(row(tile('Income'),btn(ic('ellipsis'),'goaledit:'+g.id))+'<h2 style="margin-top:14px">'+esc(g.name)+(g.sample?' · Sample':'')+'</h2><strong style="font-size:25px">'+money(g.saved)+'</strong><p>of '+money(g.target)+'</p>'+track(g.saved,g.target,'#169c79')+'<p>'+Math.round(g.saved/g.target*100)+'% achieved</p>'+btn('Add funds','fund:'+g.id,'secondary full'))).join('')+'</div>'}
function insights(){let vals=Array.from({length:7},(_,i)=>tx().filter(t=>t.amount<0&&Math.min(6,Math.floor((Number(t.date.slice(-2))-1)*7/new Date(Number(period.slice(0,4)),Number(period.slice(5)),0).getDate()))===i).reduce((a,t)=>a-t.amount,0)),max=Math.max(1,...vals);return '<div class="grid">'+card('<h2>Spending over the month</h2><strong style="font-size:26px">'+money(spent())+'</strong><div class="chart">'+vals.map((v,i)=>'<div title="'+money(v)+'"><i style="height:'+v/max*90+'%"></i><span>'+ (i+1)+'</span></div>').join('')+'</div><p>Seven periods across the selected month</p>')+card('<h2>Where your money goes</h2>'+ring()+Object.keys(data.budgets).sort((a,b)=>spent(b)-spent(a)).map(c=>row('<span class="small">'+c+'</span>','<strong>'+money(spent(c))+'</strong>')).join(''))+'</div>'}
function render(){$('#app').innerHTML=row('<div class="logo">BALANCE</div>',btn(ic('settings'),'settings'))+'<div class="page" style="margin-top:24px">'+row('<h1>'+(tab==='Overview'?'Your money':tab)+'</h1>',btn(ic('plus')+' Add','add','primary'))+row('<input aria-label="Budget month" id="period" type="month" value="'+period+'" style="width:155px;margin:12px 0">','<span class="small">'+(data.tx.some(t=>t.sample)||data.goals.some(g=>g.sample)?'Sample data · ':'')+'CAD</span>')+({Overview:overview,Activity:activity,Budgets:budgets,Goals:goals,Insights:insights}[tab])()+'</div><div class="build">BALANCE · Build '+BUILD+(storage?'':' · Storage unavailable')+'</div>';$('#nav').innerHTML=tabs.map((t,i)=>'<button data-a="tab:'+t+'" aria-current="'+(tab===t?'page':'false')+'" class="'+(tab===t?'active':'')+'">'+ic(navicons[i])+t+'</button>').join('');icons()}
const field=(name,label,value='',type='text',extra='')=>'<label>'+label+'<input name="'+name+'" type="'+type+'" value="'+esc(value)+'" required '+extra+'></label>',submit=s=>'<button class="primary full" type="submit">'+s+'</button>';
function open(m){modal=m;let t=data.tx.find(t=>t.id===editId),body='';if(m==='transaction'){body='<h1>'+(t?'Edit transaction':'New transaction')+'</h1><form id="form"><label>Type<select name="kind" id="kind"><option '+(kind==='Expense'?'selected':'')+'>Expense</option><option '+(kind==='Income'?'selected':'')+'>Income</option></select></label>'+field('name','Description',t?.name)+field('amount','Amount (CAD)',t?Math.abs(t.amount)/100:'','number','min=".01" step=".01"')+'<label>Category<select name="cat" id="cat">'+(kind==='Income'?['Income']:Object.keys(limits)).map(c=>'<option '+(t?.cat===c?'selected':'')+'>'+c+'</option>').join('')+'</select></label>'+field('date','Date',t?.date||today(),'date')+submit('Save transaction')+'</form>'+(t?btn('Delete transaction','delete:'+t.id,'danger full'):'')}else if(m.startsWith('budget:')){let c=m.slice(7);body='<h1>'+c+' budget</h1><form id="form">'+field('amount','Monthly limit (CAD)',data.budgets[c]/100,'number','min="0" step=".01"')+submit('Save budget')+'</form>'}else if(m==='goal'||m.startsWith('goaledit:')){let g=data.goals.find(g=>g.id===m.slice(9));body='<h1>'+(g?'Edit goal':'New savings goal')+'</h1><form id="form">'+field('name','Goal name',g?.name)+field('amount','Target (CAD)',g?g.target/100:'','number','min=".01" step=".01"')+submit('Save goal')+'</form>'+(g?btn('Delete goal','delgoal:'+g.id,'danger full'):'')}else if(m.startsWith('fund:')){body='<h1>Add savings</h1><form id="form">'+field('amount','Amount saved (CAD)','','number','min=".01" step=".01"')+submit('Update goal')+'</form><p>Tracks savings only; no money is transferred.</p>'}else{body='<h1>Settings</h1><p>Canadian dollars · Local device storage</p>'+btn('Export backup','export','secondary full')+'<p>Remove only sample transactions and goals. Your own records stay intact.</p>'+btn('Remove sample data','clear','danger full')+'<p>Build '+BUILD+'</p>'}$('#sheet').innerHTML='<div class="handle"></div>'+body+'<div style="height:12px"></div>'+btn('Cancel','close','secondary full');if(!$('#sheet').open)$('#sheet').showModal();icons()}
function close(){modal='';$('#sheet').close()}function changed(){save();close();render()}
document.addEventListener('click',e=>{let a=e.target.closest('[data-a]')?.dataset.a;if(!a)return;if(a.startsWith('tab:')){tab=a.slice(4);render()}else if(a.startsWith('filter:')){filter=a.slice(7);render()}else if(a==='add'){editId=null;kind='Expense';open('transaction')}else if(a.startsWith('edit:')){editId=a.slice(5);kind=data.tx.find(t=>t.id===editId).amount>0?'Income':'Expense';open('transaction')}else if(a==='close')close();else if(a.startsWith('delete:')){if(confirm('Delete this transaction?')){data.tx=data.tx.filter(t=>t.id!==a.slice(7));changed()}}else if(a.startsWith('delgoal:')){if(confirm('Delete this goal?')){data.goals=data.goals.filter(g=>g.id!==a.slice(8));changed()}}else if(a==='clear'){if(confirm('Remove sample records only?')){data.tx=data.tx.filter(t=>!t.sample);data.goals=data.goals.filter(g=>!g.sample);changed()}}else if(a==='export'){let url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'})),l=document.createElement('a');l.href=url;l.download='balance-backup.json';l.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}else open(a)});
document.addEventListener('change',e=>{if(e.target.id==='period'&&e.target.value){period=e.target.value;render()}if(e.target.id==='kind'){kind=e.target.value;$('#cat').innerHTML=(kind==='Income'?['Income']:Object.keys(limits)).map(c=>'<option>'+c+'</option>').join('')}});
document.addEventListener('submit',e=>{if(e.target.id!=='form')return;e.preventDefault();let f=new FormData(e.target),amount=Math.round(Number(f.get('amount'))*100);if(!Number.isSafeInteger(amount)||amount<0)return;if(modal==='transaction'){let t={id:editId||id(),name:f.get('name').trim(),cat:f.get('cat'),amount:f.get('kind')==='Income'?amount:-amount,date:f.get('date'),sample:data.tx.find(t=>t.id===editId)?.sample||false};if(!t.name||!amount)return;data.tx=data.tx.filter(x=>x.id!==t.id);data.tx.push(t);period=t.date.slice(0,7)}else if(modal.startsWith('budget:'))data.budgets[modal.slice(7)]=amount;else if(modal==='goal'){if(!f.get('name').trim()||!amount)return;data.goals.push({id:id(),name:f.get('name').trim(),target:amount,saved:0})}else if(modal.startsWith('goaledit:')){let g=data.goals.find(g=>g.id===modal.slice(9));if(g&&amount&&f.get('name').trim()){g.name=f.get('name').trim();g.target=amount}}else if(modal.startsWith('fund:')){let g=data.goals.find(g=>g.id===modal.slice(5));if(g)g.saved+=amount}changed()});render();
setInterval(async()=>{if($('#sheet').open)return;try{let res=await fetch(location.pathname+'?buildcheck='+Date.now(),{cache:'no-store'}),html=await res.text(),m=html.match(/const BUILD=(\d+);/);if(m&&Number(m[1])>BUILD)location.reload()}catch{}},5000);
</script></body></html>
