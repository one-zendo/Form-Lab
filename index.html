<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="form-build" content="003">
  <title>FORM · Layout Lab Build 003</title>
  <link rel="stylesheet" href="layout-lab.css?v=003">
  <link rel="stylesheet" href="foundation/diagnostics.css?v=003">
  <script defer src="foundation/geometry.js?v=003"></script>
  <script defer src="foundation/posture.js?v=003"></script>
  <script defer src="foundation/orientation.js?v=003"></script>
  <script defer src="foundation/viewport.js?v=003"></script>
  <script defer src="shell.js?v=003"></script>
  <script defer src="foundation/diagnostics.js?v=003"></script>
  <script defer src="foundation/update.js?v=003"></script>
</head>
<body>
  <main class="form-page" id="home">
    <div class="headline-region">
      <header class="headline">
        <h1>FORM</h1>
        <button id="diagnostic-open" type="button" aria-haspopup="dialog">Diagnostics</button>
      </header>
    </div>

    <div class="content" role="region" aria-label="Home overview" tabindex="0">
      <p class="tagline">Train with focus, follow your progress</p>
      <div class="form-grid">
        <article class="form-card">
          <h2>Today’s workout</h2>
          <p>Workout overview</p>
        </article>
        <article class="form-card">
          <h2>Weekly activity</h2>
          <ul class="activity-week" aria-label="Days of the week">
            <li>Mon</li><li>Tue</li><li>Wed</li><li>Thu</li><li>Fri</li><li>Sat</li><li>Sun</li>
          </ul>
        </article>
      </div>
    </div>

    <div class="dock-region">
      <nav id="dock" aria-label="Primary navigation">
        <a href="#home" aria-current="page">Home</a>
        <button type="button" disabled>Workouts</button>
        <button type="button" disabled>Progress</button>
        <button type="button" disabled>Profile</button>
      </nav>
    </div>
  </main>

  <dialog id="diagnostics" aria-labelledby="diagnostic-title">
    <header class="headline">
      <div>
        <h2 id="diagnostic-title">Diagnostics</h2>
        <p>Layout Lab Build 003</p>
      </div>
      <form method="dialog"><button type="submit">Done</button></form>
    </header>
    <label class="diag-row">Enable diagnostics <input type="checkbox" id="guides"></label>
    <fieldset id="diagnostic-controls">
      <legend>Alignment guides</legend>
      <label class="diag-row">Camera <input type="checkbox" data-guide="Camera" checked></label>
      <label class="diag-row">Headline <input type="checkbox" data-guide="Headline" checked></label>
      <label class="diag-row">Viewport <input type="checkbox" data-guide="Viewport" checked></label>
      <label class="diag-row">Content and cards <input type="checkbox" data-guide="Content" checked></label>
      <label class="diag-row">Safe areas <input type="checkbox" data-guide="Safe areas" checked></label>
      <label class="diag-row">Grid <input type="checkbox" data-guide="Grid"></label>
      <label class="diag-row">Measurement labels <input type="checkbox" id="guide-labels" checked></label>
    </fieldset>
    <p id="storage-status" aria-live="polite"></p>
    <details>
      <summary>Device measurements</summary>
      <dl id="readout"></dl>
    </details>
  </dialog>
  <div id="diagnostic-overlay" aria-hidden="true"></div>
  <div id="safe-probe" aria-hidden="true">
    <span></span><span></span><span></span><span></span>
  </div>
</body>
</html>
