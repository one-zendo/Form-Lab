const BUILD=41;const tabs=['Home','Workouts','Progress','Profile'],icons=['house','dumbbell','chart-no-axes-combined','user-round'];let page='Home',section='Routines';const main=document.querySelector('main');const icon=n=>'<i data-lucide="'+n+'"></i>';const head=t=>'<h1 class="headline">'+t+'</h1>';function layout(){const w=document.documentElement.clientWidth,h=document.documentElement.clientHeight,s=Math.min(w,h),l=Math.max(w,h),ratio=Math.min(screen.width,screen.height)/Math.max(screen.width,screen.height);const duo=ratio>.62;const folded=duo&&s<=530&&l<=760;const mode=folded?'folded-'+(w>h?'landscape':'portrait'):duo?'unfolded-'+(w>h?'landscape':'portrait'):'standard-'+(w>h?'landscape':'portrait');document.body.dataset.layout=mode;document.body.dataset.dock=folded||w>h?'side':'bottom';document.body.dataset.posture=navigator.devicePosture?.type||(matchMedia('(device-posture: folded)').matches?'folded':'unknown');const f=document.querySelector('.foot');if(f)f.textContent='Build '+BUILD+' · '+mode+' · '+document.body.dataset.posture}

,i)=>b.setAttribute('aria-current',tabs[i]===page?'page':'false'));window.lucide?.createIcons({attrs:{'stroke-width':1.75}});layout()}
function go(t){page=t;render()}document.querySelector('.nav').innerHTML=tabs.map((t,i)=>'<button aria-label="'+t+'" data-go="'+t+'">'+icon(icons[i])+'</button>').join('');document.querySelector('.proxy').innerHTML=tabs.map(t=>'<button tabindex="-1" data-go="'+t+'">'+t+'</button>').join('');document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.go)go(b.dataset.go);if(b.dataset.section){section=b.dataset.section;render()}});addEventListener('resize',layout);window.visualViewport?.addEventListener('resize',layout);navigator.devicePosture?.addEventListener('change',layout);matchMedia('(device-posture: folded)').addEventListener('change',layout);let checking=false;async function update(){if(checking||document.hidden)return;checking=true;try{const r=await fetch(location.pathname+'?check='+Date.now(),{cache:'no-store'});if(r.ok&&Number((await r.text()).match(/const BUILD=(\d+)/)?.[1])>BUILD)location.replace(location.pathname+'?refresh='+Date.now())}catch{}finally{checking=false}}addEventListener('pageshow',update);addEventListener('focus',update);document.addEventListener('visibilitychange',update);render();
