name: FORM reset integrity
on: [push, workflow_dispatch]
jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('version.json').read_text())['status'] == 'reset'
          assert 'Repository reset' in Path('index.html').read_text()
          assert not Path('src').exists()
          assert not Path('tests').exists()
          for p in ['FP','FL1','FL2','UP','UL']:
              assert Path(f'design/duo/{p}.svg').is_file()
          PY
