name: Shell quality
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: for file in shell.js foundation/*.js; do node --check "$file" || exit 1; done
      - run: node --test tests/*.test.cjs
