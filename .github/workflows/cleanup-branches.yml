name: Clean up branches

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete all branches except main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          gh api "repos/$repo/branches" --paginate \
            --jq '.[].name' > branches.txt

          while IFS= read -r branch; do
            if [ "$branch" != "main" ]; then
              gh api --method DELETE \
                "repos/$repo/git/refs/heads/$branch"
            fi
          done < branches.txt
